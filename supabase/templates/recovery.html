<h2>Reset your password</h2>

<p>
  We received a request to reset the password for your Shared Household Journal
  account.
</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery"
    >Choose a new password</a
  >
</p>

<p>
  This link expires in one hour. If you didn't ask for it, you can ignore this
  email and your password stays the same.
</p>
